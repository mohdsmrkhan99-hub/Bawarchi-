name: Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bawarchi
          POSTGRES_PASSWORD: bawarchi_dev_password
          POSTGRES_DB: bawarchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U bawarchi -d bawarchi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: bawarchi-app
    env:
      DATABASE_URL: postgresql://bawarchi:bawarchi_dev_password@localhost:5432/bawarchi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bawarchi-app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run db:seed:menu
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run start > /tmp/bawarchi-next.log 2>&1 &
      - run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:3000/api/health && break
            sleep 2
          done
      - run: npm run test:smoke
